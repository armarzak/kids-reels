name: Телеграм-бот

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: telegram-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    if: github.repository == 'armarzak/kids-reels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Забрать сообщения и обновить список
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_IDS: ${{ vars.TELEGRAM_ALLOWED_IDS }}
        run: node scripts/telegram-bot.mjs

      - name: Закоммитить изменения
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Менять нечего."
            exit 0
          fi
          git config user.name "kids-reels bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json settings.json .github/bot-state.json
          git commit -m "Бот: обновил список видео"
          git push
