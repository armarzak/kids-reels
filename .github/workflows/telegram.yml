name: Телеграм-бот

on:
  # GitHub сильно душит расписание: '*/5' на деле срабатывает раз в
  # несколько часов. Поэтому расписание тут — не способ опрашивать,
  # а способ поставить в очередь следующую смену.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: telegram-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    if: github.repository == 'armarzak/kids-reels'
    runs-on: ubuntu-latest
    # Потолок GitHub — 6 часов на задание. Берём почти всё: длинная
    # смена единственный способ быть на линии постоянно.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история: бот сам делает rebase, если в ветку
          # закоммитили, пока шла смена.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Нужен только для уведомлений на телефоны.
      - name: Поставить web-push
        run: npm install --no-save --no-audit --no-fund web-push@3.6.7

      # Коммитит и пушит сам скрипт — по ходу смены, а не в конце.
      - name: Дежурить у Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_IDS: ${{ vars.TELEGRAM_ALLOWED_IDS }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          POLL_MINUTES: '345'
        run: node scripts/telegram-bot.mjs
