name: Телеграм-бот

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: telegram-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    if: github.repository == 'armarzak/kids-reels'
    runs-on: ubuntu-latest
    # Смена чуть длиннее срока дежурства: если задание зависнет,
    # оно не займёт очередь на шесть часов.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история: бот сам делает rebase, если в ветку
          # закоммитили, пока шла смена.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Коммитит и пушит сам скрипт — по ходу смены, а не в конце.
      - name: Дежурить у Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_IDS: ${{ vars.TELEGRAM_ALLOWED_IDS }}
          POLL_MINUTES: '50'
        run: node scripts/telegram-bot.mjs
